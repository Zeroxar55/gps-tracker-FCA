<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatmap — GPS Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
    #topbar {
      padding: 12px 16px; background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1rem; white-space: nowrap; }
    select, #dateInput {
      padding: 8px 12px; background: #0f172a; color: #f1f5f9;
      border: 1px solid #38bdf8; border-radius: 8px; font-size: 0.9rem;
    }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .btn-blue { background: #0ea5e9; color: white; }
    .btn-gray { background: #334155; color: #f1f5f9; }
    #statsBar {
      padding: 8px 16px; background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.82rem; color: #94a3b8;
    }
    #statsBar span { color: #f1f5f9; font-weight: bold; }
    #map { flex: 1; }

    /* Timeline panel */
    #timelinePanel {
      display: none; position: fixed; right: 0; top: 0; bottom: 0;
      width: 320px; background: #1e293b; border-left: 1px solid #334155;
      z-index: 9999; flex-direction: column;
    }
    #timelinePanel.open { display: flex; }
    #tlHeader {
      padding: 14px 16px; background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center;
    }
    #tlHeader h2 { font-size: 0.95rem; }
    #tlClose {
      background: none; border: none; color: #94a3b8;
      font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
    }
    #tlClose:hover { color: #f1f5f9; }
    #tlContent { flex: 1; overflow-y: auto; padding: 12px; }
    .tl-item {
      display: flex; gap: 12px; margin-bottom: 16px; position: relative;
    }
    .tl-item::before {
      content: ''; position: absolute; left: 17px; top: 28px;
      width: 2px; height: calc(100% + 4px); background: #334155;
    }
    .tl-item:last-child::before { display: none; }
    .tl-dot {
      width: 36px; height: 36px; border-radius: 50%;
      background: #0ea5e9; display: flex; align-items: center;
      justify-content: center; font-size: 0.8rem; flex-shrink: 0;
      border: 2px solid #38bdf8;
    }
    .tl-body { flex: 1; }
    .tl-time { font-size: 0.8rem; color: #38bdf8; font-weight: bold; }
    .tl-coord { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .tl-btn {
      margin-top: 4px; padding: 4px 10px; background: #0f172a;
      border: 1px solid #334155; border-radius: 6px;
      color: #94a3b8; font-size: 0.75rem; cursor: pointer;
    }
    .tl-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    #tlEmpty { color: #64748b; text-align: center; padding: 40px 16px; font-size: 0.9rem; }
    #tlUid { font-size: 0.7rem; color: #475569; padding: 0 16px 8px; word-break: break-all; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>🗺️ Heatmap</h1>
  <select id="parkSelect" onchange="loadData()">
    <option value="all">🌿 ทุกอุทยาน</option>
  </select>
  <select id="modeSelect" onchange="loadData()">
    <option value="daily">รายวัน</option>
    <option value="monthly">รายเดือน</option>
  </select>
  <input type="date" id="dateInput" onchange="loadData()">
  <button class="btn btn-blue" onclick="loadData()">🔄 โหลด</button>
  <button class="btn btn-gray" onclick="runSummary()">📊 สรุปวันนี้</button>
</div>

<div id="statsBar">
  <div>อุทยาน: <span id="statPark">—</span></div>
  <div>จุดทั้งหมด: <span id="statPoints">—</span></div>
  <div>นักท่องเที่ยว (ประมาณ): <span id="statVisitors">—</span></div>
  <div>วันที่: <span id="statDate">—</span></div>
</div>

<div id="map"></div>

<!-- Timeline Panel -->
<div id="timelinePanel">
  <div id="tlHeader">
    <h2>📍 เส้นทางนักท่องเที่ยว</h2>
    <button id="tlClose" onclick="closeTimeline()">✕</button>
  </div>
  <div id="tlUid"></div>
  <div id="tlContent">
    <div id="tlEmpty">กด marker เพื่อดูเส้นทาง</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, set, remove }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAb6EUMSsuaC9Ou1FrWfIgOiDY-_1fuEW4",
    authDomain: "tracking-system-test-fca.firebaseapp.com",
    databaseURL: "https://tracking-system-test-fca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tracking-system-test-fca",
    storageBucket: "tracking-system-test-fca.firebasestorage.app",
    messagingSenderId: "652915365750",
    appId: "1:652915365750:web:c3f0610fc7f63dda630c57"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  function todayStr() {
    return new Date(Date.now() + 7*3600000).toISOString().slice(0,10);
  }
  function monthStr() { return todayStr().slice(0,7); }

  document.getElementById("dateInput").value = todayStr();

  const map = L.map("map").setView([18.0, 100.5], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);

  let clusterGroup = null;
  let routeLayer   = null;
  let parksData    = {};

  // โหลดรายการอุทยาน
  onValue(ref(db, "parks"), (snap) => {
    parksData = snap.val() || {};
    const select = document.getElementById("parkSelect");
    select.innerHTML = '<option value="all">🌿 ทุกอุทยาน</option>';
    Object.entries(parksData).forEach(([id, park]) => {
      select.innerHTML += `<option value="${park.code}">${park.name}${park.region ? ' ('+park.region+')' : ''}</option>`;
    });
  });

  // โหลดข้อมูล + วาด cluster
  window.loadData = async () => {
    const parkCode = document.getElementById("parkSelect").value;
    const mode     = document.getElementById("modeSelect").value;
    const dateVal  = document.getElementById("dateInput").value;
    const dateKey  = mode === "monthly" ? dateVal.slice(0,7) : dateVal;

    if (clusterGroup) { map.removeLayer(clusterGroup); }
    if (routeLayer)   { map.removeLayer(routeLayer); routeLayer = null; }
    closeTimeline();

    clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 60,
      iconCreateFunction: (cluster) => {
        const count = cluster.getChildCount();
        const size  = count > 100 ? 50 : count > 30 ? 40 : 30;
        const color = count > 100 ? "#ef4444" : count > 30 ? "#f59e0b" : "#22c55e";
        return L.divIcon({
          html: `<div style="width:${size}px;height:${size}px;border-radius:50%;
                 background:${color};opacity:0.85;display:flex;align-items:center;
                 justify-content:center;color:white;font-weight:bold;font-size:${size>40?14:12}px;
                 border:2px solid white">${count}</div>`,
          iconSize: [size, size], className: ""
        });
      }
    });

    const dbPath = mode === "monthly" ? `monthly/${dateKey}` : `daily/${dateKey}`;
    const snap   = await get(ref(db, dbPath));
    const data   = snap.val();

    // เก็บข้อมูลทุก session แยกตาม uid
    // allSessions = { uid: [ {lat, lng, t, code}, ... ] }
    const allSessions = {};
    let totalPoints = 0;

    if (data) {
      Object.entries(data).forEach(([code, points]) => {
        if (parkCode !== "all" && code !== parkCode) return;
        const pts = typeof points === "object" && !Array.isArray(points)
          ? Object.values(points) : points;

        pts.forEach(pt => {
          if (!pt.lat || !pt.lng) return;
          totalPoints++;
          const uid = pt.uid || "unknown";

          if (!allSessions[uid]) allSessions[uid] = [];
          allSessions[uid].push({ ...pt, code });

          const marker = L.circleMarker([pt.lat, pt.lng], {
            radius: 6, fillColor: "#38bdf8",
            color: "white", weight: 1, fillOpacity: 0.8
          });

          // กด marker → เปิด timeline ของ uid นั้น
          marker.on("click", () => {
            const session = allSessions[uid].sort((a,b) => a.t - b.t);
            showTimeline(uid, session);
          });

          clusterGroup.addLayer(marker);
        });
      });
    }

    map.addLayer(clusterGroup);
    if (totalPoints > 0) map.fitBounds(clusterGroup.getBounds(), { padding: [40,40] });

    const parkName = parkCode === "all" ? "ทุกอุทยาน"
      : (Object.values(parksData).find(p => p.code === parkCode)?.name || parkCode);
    const estVisitors = Math.ceil(totalPoints / 6);

    document.getElementById("statPoints").textContent   = totalPoints.toLocaleString();
    document.getElementById("statVisitors").textContent = estVisitors.toLocaleString() + " คน";
    document.getElementById("statPark").textContent     = parkName;
    document.getElementById("statDate").textContent     = dateKey;
  };

  // แสดง Timeline Panel
  window.showTimeline = (uid, points) => {
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }

    const panel = document.getElementById("timelinePanel");
    panel.classList.add("open");

    document.getElementById("tlUid").textContent = "Session: " + uid;

    if (!points || points.length === 0) {
      document.getElementById("tlContent").innerHTML = '<div id="tlEmpty">ไม่มีข้อมูล</div>';
      return;
    }

    // วาดเส้นเส้นทาง
    const latlngs = points.map(p => [p.lat, p.lng]);
    routeLayer = L.polyline(latlngs, {
      color: "#f59e0b", weight: 3, opacity: 0.8, dashArray: "6 4"
    }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [60,60] });

    // สร้าง timeline items
    let html = "";
    points.forEach((pt, i) => {
      const time = new Date(pt.t).toLocaleTimeString("th-TH");
      const park = Object.values(parksData).find(p => p.code === pt.code);
      const parkName = park ? park.name : pt.code;
      html += `
        <div class="tl-item">
          <div class="tl-dot">${i+1}</div>
          <div class="tl-body">
            <div class="tl-time">🕐 ${time}</div>
            <div class="tl-coord">📍 ${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</div>
            <div class="tl-coord">🌿 ${parkName}</div>
            <button class="tl-btn" onclick="flyTo(${pt.lat}, ${pt.lng})">
              🔍 ดูบนแผนที่
            </button>
          </div>
        </div>`;
    });

    document.getElementById("tlContent").innerHTML = html;
  };

  window.flyTo = (lat, lng) => {
    map.flyTo([lat, lng], 17, { duration: 1 });
  };

  window.closeTimeline = () => {
    document.getElementById("timelinePanel").classList.remove("open");
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  };

  // สรุปรายวัน → monthly
  window.runSummary = async () => {
    if (!confirm("สรุปข้อมูลรายวันและเก็บเป็นรายเดือน?")) return;
    const today = todayStr();
    const dailySnap = await get(ref(db, "daily"));
    const dailyData = dailySnap.val();
    if (!dailyData) { alert("ไม่มีข้อมูลรายวัน"); return; }

    let summarized = 0;
    for (const [date, parks] of Object.entries(dailyData)) {
      if (date >= today) continue;
      const m = date.slice(0,7);
      for (const [code, points] of Object.entries(parks)) {
        const pts = typeof points === "object" && !Array.isArray(points)
          ? Object.values(points) : points;
        const monthSnap = await get(ref(db, `monthly/${m}/${code}`));
        const existing  = monthSnap.val() || [];
        const merged    = [...(Array.isArray(existing) ? existing : Object.values(existing)), ...pts];
        await set(ref(db, `monthly/${m}/${code}`), merged);
        await remove(ref(db, `daily/${date}/${code}`));
        summarized++;
      }
    }
    alert(`✅ สรุปเสร็จ ${summarized} อุทยาน/วัน`);
    loadData();
  };

  setTimeout(loadData, 1000);
</script>

</body>
</html>
