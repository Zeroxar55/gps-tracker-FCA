<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — GPS Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
    #loginScreen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; gap: 16px;
    }
    #loginScreen h1 { font-size: 1.4rem; }
    #loginScreen p { color: #94a3b8; font-size: 0.9rem; }
    #googleBtn {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 24px; background: white; color: #1e293b;
      border: none; border-radius: 8px; font-size: 1rem;
      font-weight: bold; cursor: pointer;
    }
    #googleBtn:hover { background: #f1f5f9; }
    #adminScreen { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
    #topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    #topbar h1 { font-size: 1.2rem; }
    #logoutBtn {
      padding: 8px 16px; background: #334155; color: #f1f5f9;
      border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
    }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 1rem; margin-bottom: 16px; color: #38bdf8; }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type=text] {
      flex: 1; padding: 10px 14px; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px;
      color: #f1f5f9; font-size: 0.95rem; min-width: 180px;
    }
    input[type=text]:focus { outline: none; border-color: #38bdf8; }
    .btn-primary {
      padding: 10px 20px; background: #0ea5e9; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .btn-danger {
      padding: 6px 14px; background: #ef4444; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
    }
    .btn-monitor {
      padding: 6px 14px; background: #0ea5e9; color: white;
      border: none; border-radius: 8px; font-size: 0.85rem;
      text-decoration: none; display: inline-block;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px;
      font-size: 0.8rem; color: #64748b;
      border-bottom: 1px solid #334155;
    }
    td { padding: 12px 10px; border-bottom: 1px solid #334155; font-size: 0.9rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .code-badge {
      font-family: monospace; font-size: 1.1rem; font-weight: bold;
      letter-spacing: 4px; color: #38bdf8; background: #0f172a;
      padding: 4px 10px; border-radius: 6px;
    }
    #emptyMsg { color: #64748b; text-align: center; padding: 24px; }
  </style>
</head>
<body>

<div id="loginScreen">
  <h1>🛡️ GPS Tracker Admin</h1>
  <p>เฉพาะผู้ดูแลระบบเท่านั้น</p>
  <button id="googleBtn" onclick="loginWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
    เข้าสู่ระบบด้วย Google
  </button>
  <div id="loginError" style="color:#f87171;font-size:0.85rem"></div>
</div>

<div id="adminScreen">
  <div id="topbar">
    <h1>🗺️ GPS Tracker — Admin</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="userInfo" style="font-size:0.85rem;color:#94a3b8"></span>
      <button id="logoutBtn" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="card">
    <h2>➕ เพิ่มอุทยาน</h2>
    <div class="input-row">
      <input type="text" id="parkName" placeholder="ชื่ออุทยาน เช่น ดอยอินทนนท์">
      <input type="text" id="parkRegion" placeholder="จังหวัด เช่น เชียงใหม่">
      <button class="btn-primary" onclick="addPark()">➕ เพิ่ม</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 รายการอุทยานทั้งหมด</h2>
    <table>
      <thead>
        <tr>
          <th>ชื่ออุทยาน</th>
          <th>จังหวัด</th>
          <th>รหัส</th>
          <th>Monitor</th>
          <th>ลบ</th>
        </tr>
      </thead>
      <tbody id="parkList">
        <tr><td colspan="5" id="emptyMsg">ยังไม่มีอุทยาน</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, push, onValue, remove, set }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAb6EUMSsuaC9Ou1FrWfIgOiDY-_1fuEW4",
    authDomain: "tracking-system-test-fca.firebaseapp.com",
    databaseURL: "https://tracking-system-test-fca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tracking-system-test-fca",
    storageBucket: "tracking-system-test-fca.firebasestorage.app",
    messagingSenderId: "652915365750",
    appId: "1:652915365750:web:c3f0610fc7f63dda630c57"
  };

  const ADMIN_EMAIL = "toktak1992@gmail.com"; // ← Gmail ของต๊อกกี้

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminScreen").style.display = "block";
      document.getElementById("userInfo").textContent = user.email;
      loadParks();
    } else {
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("adminScreen").style.display = "none";
      if (user) { signOut(auth); document.getElementById("loginError").textContent = "❌ ไม่มีสิทธิ์เข้าระบบ"; }
    }
  });

  window.loginWithGoogle = async () => {
    try { await signInWithPopup(auth, provider); }
    catch(e) { document.getElementById("loginError").textContent = "❌ Login ไม่สำเร็จ"; }
  };

  window.logout = () => signOut(auth);

  function genCode() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  function loadParks() {
    onValue(ref(db, "parks"), (snapshot) => {
      const tbody = document.getElementById("parkList");
      const data = snapshot.val();
      if (!data) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#64748b;text-align:center;padding:24px">ยังไม่มีอุทยาน</td></tr>';
        return;
      }
      tbody.innerHTML = "";
      Object.entries(data).forEach(([id, park]) => {
        const monitorUrl = `https://zeroxar55.github.io/gps-tracker-FCA/monitor.html?code=${park.code}`;
        tbody.innerHTML += `
          <tr>
            <td>${park.name}</td>
            <td>${park.region || "—"}</td>
            <td><span class="code-badge">${park.code}</span></td>
            <td><a class="btn-monitor" href="${monitorUrl}" target="_blank">🖥️ เปิด</a></td>
            <td><button class="btn-danger" onclick="deletePark('${id}', '${park.code}')">ลบ</button></td>
          </tr>`;
      });
    });
  }

  window.addPark = async () => {
    const name   = document.getElementById("parkName").value.trim();
    const region = document.getElementById("parkRegion").value.trim();
    if (!name) { alert("กรุณากรอกชื่ออุทยาน"); return; }
    const code = genCode();
    await push(ref(db, "parks"), { name, region, code, createdAt: Date.now() });
    document.getElementById("parkName").value = "";
    document.getElementById("parkRegion").value = "";
  };

  window.deletePark = async (id, code) => {
    if (!confirm("ลบอุทยานนี้? ข้อมูล session จะหายด้วย")) return;
    await remove(ref(db, "parks/" + id));
    await remove(ref(db, "sessions/" + code));
  };
</script>

</body>
</html>
