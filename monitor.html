<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #1e293b;
      border-bottom: 1px solid #334155; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1rem; white-space: nowrap; }
    select {
      padding: 8px 12px; background: #0f172a; color: #f1f5f9;
      border: 1px solid #334155; border-radius: 8px; font-size: 0.9rem;
    }
    #sessionBox {
      display: flex; flex-direction: column; align-items: center;
      background: #0f172a; border: 2px solid #38bdf8;
      border-radius: 8px; padding: 4px 12px; min-width: 140px;
    }
    #sessionBox .label { font-size: 0.65rem; color: #64748b; }
    #sessionCode { font-size: 1.6rem; font-weight: bold; letter-spacing: 6px; color: #38bdf8; }
    #status { font-size: 0.8rem; color: #94a3b8; flex: 1; }
    #map { flex: 1; }
    #infobar {
      padding: 8px 16px; background: #1e293b;
      border-top: 1px solid #334155;
      font-size: 0.8rem; color: #94a3b8;
      display: flex; gap: 24px; flex-wrap: wrap;
    }
    #infobar span { color: #f1f5f9; font-weight: bold; }
    #selectScreen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 16px;
    }
    #selectScreen h2 { color: #94a3b8; }
    .popup-del-btn {
      margin-top: 6px; padding: 6px 12px; background: #ef4444; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; width: 100%;
    }
    .popup-time { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>📍 GPS Monitor</h1>
  <select id="parkSelect" onchange="selectPark(this.value)">
    <option value="">— เลือกอุทยาน —</option>
  </select>
  <div id="sessionBox">
    <div class="label">SESSION CODE</div>
    <div id="sessionCode">------</div>
  </div>
  <div id="status">⏳ เลือกอุทยานก่อน</div>
</div>

<div id="selectScreen">
  <h2>🌿 กรุณาเลือกอุทยานด้านบน</h2>
</div>
<div id="map" style="display:none; flex:1;"></div>

<div id="infobar">
  <div>ผู้ใช้ที่กำลังแชร์: <span id="infoCount">0</span></div>
  <div>อัปเดตล่าสุด: <span id="infoTime">—</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, get }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAb6EUMSsuaC9Ou1FrWfIgOiDY-_1fuEW4",
    authDomain: "tracking-system-test-fca.firebaseapp.com",
    databaseURL: "https://tracking-system-test-fca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tracking-system-test-fca",
    storageBucket: "tracking-system-test-fca.firebasestorage.app",
    messagingSenderId: "652915365750",
    appId: "1:652915365750:web:c3f0610fc7f63dda630c57"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const EXPIRE_MS = 24 * 60 * 60 * 1000; // 24 ชม.

  let map = null;
  let sessionCode = null;
  let unsubscribe = null;
  let markers = {}; // deviceId -> { marker, circle }
  let parksById = {};

  // โหลดรายการอุทยาน
  onValue(ref(db, "parks"), (snapshot) => {
    const select = document.getElementById("parkSelect");
    const data = snapshot.val();
    select.innerHTML = '<option value="">— เลือกอุทยาน —</option>';
    parksById = data || {};
    if (!data) return;
    Object.entries(data).forEach(([id, park]) => {
      select.innerHTML += `<option value="${id}">${park.name}${park.region ? ' ('+park.region+')' : ''}</option>`;
    });

    // ถ้ามี ?park=ID ใน URL ให้เลือกอัตโนมัติ (มาจากลิงก์ Monitor ในหน้า Admin)
    const urlParkId = new URLSearchParams(location.search).get("park");
    if (urlParkId && parksById[urlParkId] && select.value !== urlParkId) {
      select.value = urlParkId;
      selectPark(urlParkId);
    }
  });

  // เลือกอุทยาน
  window.selectPark = async (parkId) => {
    if (!parkId) return;
    const park = parksById[parkId];

    if (!park || !park.code) {
      document.getElementById("status").textContent = "❌ อุทยานนี้ยังไม่มีรหัส Session (สร้างจากหน้า Admin)";
      return;
    }

    sessionCode = park.code;
    document.getElementById("sessionCode").textContent = sessionCode;

    // เปิดแผนที่
    document.getElementById("selectScreen").style.display = "none";
    document.getElementById("map").style.display = "block";

    if (!map) {
      map = L.map("map").setView([18.7883, 98.9853], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
      }).addTo(map);
    }
    setTimeout(() => map.invalidateSize(), 100);

    // เคลียร์ marker เก่าทั้งหมด
    if (unsubscribe) unsubscribe();
    Object.values(markers).forEach(({ marker, circle }) => {
      map.removeLayer(marker);
      map.removeLayer(circle);
    });
    markers = {};

    document.getElementById("status").textContent = "⏳ รอนักท่องเที่ยวแชร์ตำแหน่ง...";

    // ฟังตำแหน่งผู้ใช้ทุกคนภายใต้รหัสนี้ (หลายคนพร้อมกันได้)
    unsubscribe = onValue(ref(db, "sessions/" + sessionCode), (snap) => {
      const data = snap.val() || {};
      const now = Date.now();
      let activeCount = 0;
      let latestUpdate = 0;
      const seenIds = new Set();

      Object.entries(data).forEach(([deviceId, loc]) => {
        if (!loc || !loc.updatedAt) return;

        // หมดอายุ 24 ชม. -> ลบทิ้งจาก Firebase และไม่แสดง
        if (now - loc.updatedAt > EXPIRE_MS) {
          remove(ref(db, "sessions/" + sessionCode + "/" + deviceId));
          return;
        }

        seenIds.add(deviceId);
        activeCount++;
        if (loc.updatedAt > latestUpdate) latestUpdate = loc.updatedAt;

        const timeStr = new Date(loc.updatedAt).toLocaleTimeString("th-TH");
        const popupHtml = `
          <div>
            <b>📍 ผู้ใช้: ${deviceId}</b><br>
            ความแม่นยำ: ±${loc.accuracy}ม.
            <div class="popup-time">อัปเดตล่าสุด ${timeStr}</div>
            <button class="popup-del-btn" onclick="window.removeUser('${deviceId}')">🗑️ ลบตำแหน่งนี้</button>
          </div>`;

        if (!markers[deviceId]) {
          const marker = L.marker([loc.lat, loc.lng]).addTo(map).bindPopup(popupHtml);
          const circle = L.circle([loc.lat, loc.lng], { radius: loc.accuracy, color: "#38bdf8", fillOpacity: 0.1 }).addTo(map);
          markers[deviceId] = { marker, circle };
        } else {
          markers[deviceId].marker.setLatLng([loc.lat, loc.lng]).setPopupContent(popupHtml);
          markers[deviceId].circle.setLatLng([loc.lat, loc.lng]).setRadius(loc.accuracy);
        }
      });

      // เอา marker ของคนที่หายไป (ลบ/หมดอายุ) ออกจากแผนที่
      Object.keys(markers).forEach((deviceId) => {
        if (!seenIds.has(deviceId)) {
          map.removeLayer(markers[deviceId].marker);
          map.removeLayer(markers[deviceId].circle);
          delete markers[deviceId];
        }
      });

      // ปรับมุมมองแผนที่ให้เห็นทุกคนพอดี ตอนมีข้อมูลครั้งแรก
      const activeMarkers = Object.values(markers).map(m => m.marker);
      if (activeMarkers.length === 1) {
        map.setView(activeMarkers[0].getLatLng(), 16);
      } else if (activeMarkers.length > 1) {
        const group = L.featureGroup(activeMarkers);
        map.fitBounds(group.getBounds().pad(0.2));
      }

      document.getElementById("infoCount").textContent = activeCount;
      document.getElementById("infoTime").textContent = latestUpdate ? new Date(latestUpdate).toLocaleTimeString("th-TH") : "—";
      document.getElementById("status").textContent = activeCount > 0
        ? `🟢 กำลัง Tracking ${activeCount} คน — ${sessionCode}`
        : `⏳ รอนักท่องเที่ยวแชร์ตำแหน่ง... — ${sessionCode}`;
    });
  };

  // ลบตำแหน่งของผู้ใช้คนเดียว (คลิกจาก popup บน Marker)
  window.removeUser = async (deviceId) => {
    if (!sessionCode) return;
    if (!confirm("ลบตำแหน่งของผู้ใช้คนนี้?")) return;
    await remove(ref(db, "sessions/" + sessionCode + "/" + deviceId));
  };
</script>

</body>
</html>
