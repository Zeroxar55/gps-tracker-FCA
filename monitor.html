<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #1e293b;
      border-bottom: 1px solid #334155; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1rem; white-space: nowrap; }
    #codeBox {
      background: #0f172a; border: 2px solid #38bdf8;
      border-radius: 8px; padding: 4px 14px; text-align: center;
    }
    #codeBox .label { font-size: 0.65rem; color: #64748b; }
    #codeBox .code { font-size: 1.4rem; font-weight: bold; letter-spacing: 6px; color: #38bdf8; }
    #parkName { font-size: 0.9rem; color: #94a3b8; }
    #status { font-size: 0.8rem; color: #94a3b8; flex: 1; }
    #countBox { font-size: 0.85rem; color: #f1f5f9; white-space: nowrap; }
    #map { flex: 1; }
    #noCodeScreen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
    }
    #noCodeScreen p { color: #64748b; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>📍 GPS Monitor</h1>
  <div id="codeBox">
    <div class="label">PARK CODE</div>
    <div class="code" id="codeDisplay">------</div>
  </div>
  <div id="parkName">—</div>
  <div id="status">⏳ รอการเชื่อมต่อ...</div>
  <div id="countBox">👥 0 คน</div>
</div>

<div id="noCodeScreen">
  <h2>⚠️ ไม่พบรหัสอุทยาน</h2>
  <p>กรุณาเปิดหน้านี้จากหน้า Admin</p>
</div>
<div id="map" style="display:none;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, get }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAb6EUMSsuaC9Ou1FrWfIgOiDY-_1fuEW4",
    authDomain: "tracking-system-test-fca.firebaseapp.com",
    databaseURL: "https://tracking-system-test-fca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tracking-system-test-fca",
    storageBucket: "tracking-system-test-fca.firebasestorage.app",
    messagingSenderId: "652915365750",
    appId: "1:652915365750:web:c3f0610fc7f63dda630c57"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ดึง code จาก URL ?code=XXXXXX
  const urlParams = new URLSearchParams(window.location.search);
  const parkCode  = urlParams.get("code");

  if (!parkCode) {
    // ไม่มี code ใน URL
    document.getElementById("noCodeScreen").style.display = "flex";
    document.getElementById("map").style.display = "none";
  } else {
    document.getElementById("noCodeScreen").style.display = "none";
    document.getElementById("map").style.display = "block";
    document.getElementById("codeDisplay").textContent = parkCode;

    // หาชื่ออุทยานจาก code
    onValue(ref(db, "parks"), (snap) => {
      const data = snap.val();
      if (!data) return;
      const park = Object.values(data).find(p => p.code === parkCode);
      if (park) document.getElementById("parkName").textContent = `🌿 ${park.name} ${park.region ? '— '+park.region : ''}`;
    });

    // Init map
    const map = L.map("map").setView([18.7883, 98.9853], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const markers = {}; // userId → marker
    const circles = {}; // userId → circle

    // ฟัง sessions realtime
    onValue(ref(db, "sessions/" + parkCode), (snap) => {
      const data = snap.val();
      const now  = Date.now();
      const limit24h = 24 * 60 * 60 * 1000;

      // ลบ marker ที่ไม่มีแล้ว
      const activeIds = data ? Object.keys(data) : [];
      Object.keys(markers).forEach(uid => {
        if (!activeIds.includes(uid)) {
          map.removeLayer(markers[uid]);
          map.removeLayer(circles[uid]);
          delete markers[uid];
          delete circles[uid];
        }
      });

      if (!data) {
        document.getElementById("status").textContent = "⏳ ยังไม่มีนักท่องเที่ยว";
        document.getElementById("countBox").textContent = "👥 0 คน";
        return;
      }

      let count = 0;
      let firstUser = true;

      Object.entries(data).forEach(([uid, d]) => {
        // Auto-terminate 24 ชม.
        if (now - d.startedAt > limit24h) {
          remove(ref(db, "sessions/" + parkCode + "/" + uid));
          return;
        }

        count++;
        const { lat, lng, accuracy, updatedAt } = d;
        const timeStr = new Date(updatedAt).toLocaleTimeString("th-TH");

        if (!markers[uid]) {
          // สร้าง marker ใหม่
          const m = L.marker([lat, lng]).addTo(map);
          m.bindPopup(`
            <b>🧭 นักท่องเที่ยว</b><br>
            อัปเดต: ${timeStr}<br>
            ±${accuracy}ม.<br>
            <button onclick="terminateUser('${uid}')"
              style="margin-top:8px;padding:6px 12px;background:#ef4444;
              color:white;border:none;border-radius:6px;cursor:pointer;width:100%">
              ⛔ Terminate
            </button>
          `);
          markers[uid] = m;
          circles[uid] = L.circle([lat, lng], {
            radius: accuracy, color: "#38bdf8", fillOpacity: 0.1
          }).addTo(map);
        } else {
          markers[uid].setLatLng([lat, lng]);
          markers[uid].setPopupContent(`
            <b>🧭 นักท่องเที่ยว</b><br>
            อัปเดต: ${timeStr}<br>
            ±${accuracy}ม.<br>
            <button onclick="terminateUser('${uid}')"
              style="margin-top:8px;padding:6px 12px;background:#ef4444;
              color:white;border:none;border-radius:6px;cursor:pointer;width:100%">
              ⛔ Terminate
            </button>
          `);
          circles[uid].setLatLng([lat, lng]).setRadius(accuracy);
        }

        if (firstUser) { map.setView([lat, lng], 15); firstUser = false; }
      });

      document.getElementById("countBox").textContent = `👥 ${count} คน`;
      document.getElementById("status").textContent = count > 0 ? "🟢 กำลัง Tracking" : "⏳ ยังไม่มีนักท่องเที่ยว";
    });

    // Terminate รายคน
    window.terminateUser = async (uid) => {
      if (!confirm("ลบนักท่องเที่ยวคนนี้?")) return;
      await remove(ref(db, "sessions/" + parkCode + "/" + uid));
    };
  }
</script>

</body>
</html>
